name: PHP examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and cURL requests
        run: |
          find . -name '*.php' -exec php -l {} \; | tee /tmp/php-lint
          ! grep -q 'Errors parsing' /tmp/php-lint
          php -S 127.0.0.1:8087 tests/router.php > /tmp/redsms-server.log 2>&1 &
          for i in {1..30}; do nc -z 127.0.0.1 8087 && break; sleep 0.2; done
          php tests/smoke.php
